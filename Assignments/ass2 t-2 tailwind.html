<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title> tailwind css</title>
</head>
<body class="m-25 p-25 bg-gray-900">
    <!-- Notification Center Card -->
<div class="">
    
    <!-- Header Row -->
    <div class="flex justify-between items-center mb-6">
        <h2 class="text-5xl font-bold  text-gray-800 ">
            Notification Center
        </h2>
        <span class="inline-flex items-center bg-blue-100 text-blue-700 text-xs font-semibold px-3 py-1 rounded-full">
            3 New
        </span>
    </div>
        
        <!-- Alert Item (High Priority) -->
        <div class="bg-red-100 border-l-4 border-red-500 p-4 rounded-r-lg flex items-center shadow-sm">
            <div class="flex-1">
                <p class="text-sm font-bold text-red-700">Action Requried</p>
                <p class="text-xs text-red-600">Your last payment attempt failed.Update your payment menthod to avoid serive interrupation...</p>
            </div>
        </div>

        <!-- Standard Notification -->
        <div class="bg-red-100 border-l-4 border-red-500 p-4 rounded-r-lg flex items-center shadow-sm">
            <div class="flex-1">
                <p class="text-sm font-semibold text-yellow-800">Maintenance Notice</p>
                <p class="text-xs text-gray-500">The system will undergo maintenance tonight. Some featues may be temporarily unavailable...</p>
            </div>
        </div>

</body>
</html>
