<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ordered list</title>
</head>
<body>
    <!-- ordered list with different numbering styles -->
     <ol>
        <li>Tab</li>
     </ol>
     <ol type="a">
        <li>tab</li>
     </ol>
     <ol type="A">
        <li>tab</li>
     </ol>
     <ol type="i">
        <li>tab</li>
        <li>phone</li>
     </ol>
     <ol type="I">
        <li>tab</li>
     </ol>
     <ol type="I" reversed start="8">
        <li>power bank</li>
        <li>watch</li>
        <li>car</li>
     </ol>
    
</body>
</html>
