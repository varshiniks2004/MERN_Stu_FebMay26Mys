<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nesting lists</title>
</head>
<body>
    <!--  Nesting of lists -->
    <ol>
        <li>Starters</li>
        <ul>
            <li>soups
            <ul>
                <li>Manchow soup</li>
                <li>Tomato soup</li>
            </ul>
            </li>
            <li>salads
                <ul>
                    <li>fruit salad</li>
                    <li>dry fruit salad</li>
                </ul>
            </li>
        </ul>

    </ol>

    
</body>
</html>
