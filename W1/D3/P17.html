<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>class Selector</title>
    <style>
        /* class selector */
        .ParaType1{
            background-color:aqua;
            font-weight:bold ;
        }
        .ParaType2{
            color:red;
        }
        /* ID Selector */
        #main-title{
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <p class="ParaType1">This is a paragraph</p>
    <p class="Paratype2">This is a paragraph 2</p>
    <!-- ID selector -->
     <h1 id="main-title">main heading</h1>
    
    
</body>
</html>
