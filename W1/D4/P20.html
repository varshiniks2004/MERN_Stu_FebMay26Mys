<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>attributes and pesudo class selector</title>
    <style>
        /* attribute selector */
        input [type="text"]{
            border:2px seagreen;
            padding: 5px;
        }
        /* Pseudo class selector */
        button:hover{
            background-color: bisque;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <input type="text" placeholder="This input is styled">
    <input type="password"placeholder="this input is not styled">
    <button>hover on me</button>
    
</body>
</html>
