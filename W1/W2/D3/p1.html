<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>flex basics</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body>
    <section class="border p-6 ">
        <h2>without flex</h2>
        <div class="border rounded-lg p-4 space-y-4 ">
            <div class="bg-gray-200 p-2 rounded">logo</div>
            <div class="bg-gray-200 p-3 rounded">links</div>
            <div class="bg-gray-200 p-1 rounded">contact</div>
        </div>
        </section>
    <section class="border p-6  ">
        <h2>with flex</h2>
        <div class="border rounded-lg p-4 space y-4 flex gap-4">
            <div class="bg-gray-200 p-2 rounded">logo</div>
            <div class="bg-gray-200 p-3 rounded">links</div>
            <div class="bg-gray-200 p-1 rounded">contact</div>
        </div>
    </section>    
    
</body>
</html>
