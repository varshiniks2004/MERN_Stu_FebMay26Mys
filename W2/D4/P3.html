<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> modal centering</title>
     <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-blue-300">
    <main class="max-w-4xl mx-auto p-4 space-y-8">
        <div class="fixed inset-0 z-50 flex items-center justify-center">
            <div class="bg-pink-300 w[min(520px,92vw)] border rounded p-6 shadow-lg">
                <h2>My modal</h2>
                <p class="mt-2 text-sm">my first modal</p>
                <div class="flex justify-end gap-3 mt-6"></div>
                <button class="px-4 py-2 rounded border hover:bg-red-300 transition">cancel</button>
                 <button class="px-4 py-2 rounded border hover:bg-gray-300 transition">confirm</button>

            </div>
        </div>
    </main>
    
</body>
</html>
