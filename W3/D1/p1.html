<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> console usage and simple DOM manipulation</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body>
    <h1 class="text-2xl font-bold"> My First JavaScript</h1>
    <button id="runbtn" class="px-3 py-1 rounded mt-2 mb-2 bg-black text-white">run</button>
    <pre id="out">

    </pre>
    <script>
        const out =document.getElementById("out");
        //function which accepts variables no. of args
        function print(...args){
            //console
            console.log(...args);
            out.textContent+=args.join("")+"\n";



        }
        function run(){
        print("Hi from javascript");
        print("2+3=",4+3);
        document.body.style.background="#27F5EB";
        }
        document.getElementById("runbtn").addEventListener("click",run);
        run();

         

        

    </script>

    
    
</body>
</html>
