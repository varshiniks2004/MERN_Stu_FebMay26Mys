<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS Variables var,let,const</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body>
    <pre id="out">
    </pre>
     <button id="runBtn" class="px-3 py-1 rounded mt-2 mb-2 bg-black text-white">run</button>
    <script>
        const out = document.getElementById("out");

        function print(...args){
        // console
        console.log(...args);
        out.textContent+=args.join("")+"\n";   
    }

        function clearOut(){
            out.textContent = "";
        }

        function run(){
            clearOut();
            if(true){
                var x="var escapes the if block";
            }
            print("X=",x);
            //let:scope
            if(true){
                let y="let stays in the if block";
                print("Y inside block=",y);

            }
            //print("Y outside block=",y);

            print("before declaration=",testvar);
            var testvar="assigned value now";
            print("After declaration=",testvar);
            try{
                print("before let declaration",testlet);
            }
            catch(e){
                print("Accessing let before declaration causes",e.name,e.message);
            }
            let testlet="declared now";
            print("after declaration",testlet);      
          }
        document.getElementById("runBtn").addEventListener
    ("click",run);
    
    </script>
</body>
</html>
